[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-main-speaker"
version = "0.2.0"
description = "Stage-based pipeline to extract primary-speaker time ranges from conversational audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
pyannote = ["pyannote.audio>=4.0,<5"]
benchmark = [
  "tqdm>=4.66",
  "torch>=2.2",
  "torchaudio>=2.2",
  "speechbrain>=1.0.0",
  "transformers>=4.48.0,<5.0.0",
  "huggingface-hub>=0.34.0,<1.0.0",
  "pyannote.audio>=4.0.0",
  "webrtcvad>=2.0.10",
  "resemblyzer>=0.1.4",
]
test = []

[project.scripts]
ams = "ams.app.cli:app"
ams-benchmark = "ams.benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ams = ["config/presets/*.yaml"]
